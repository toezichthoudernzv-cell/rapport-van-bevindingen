<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Rapport van bevindingen - generator</title>
<style>
  :root{
    --blue:#1f6fb3;
    --green:#2fa88c;
    --ink:#1a1a1a;
    --line:#d9d9d9;
    --panel:#f6f7f8;
    --accent:#2fa88c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Calibri,Arial,sans-serif;
    background:#e8eaed;
    color:var(--ink);
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* ---------- FORM (left) ---------- */
  .form-pane{
    width:440px;
    flex-shrink:0;
    background:#fff;
    border-right:1px solid var(--line);
    padding:22px 22px 80px 22px;
    overflow-y:auto;
    max-height:100vh;
  }
  .form-pane h1{
    font-size:18px;
    margin:0 0 4px 0;
  }
  .form-pane .sub{
    font-size:12.5px;
    color:#666;
    margin:0 0 20px 0;
  }
  fieldset{
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px 14px 14px;
    margin:0 0 14px 0;
  }
  legend{
    font-size:12.5px;
    font-weight:700;
    color:var(--blue);
    padding:0 6px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    margin:8px 0 3px 0;
  }
  label.first{margin-top:0;}
  input[type=text], input[type=date], textarea, select{
    width:100%;
    font-family:inherit;
    font-size:13px;
    padding:6px 8px;
    border:1px solid #c7c9cc;
    border-radius:5px;
    background:#fff;
  }
  textarea{resize:vertical;min-height:60px;}
  .row2{display:flex;gap:8px;}
  .row2 > div{flex:1;}
  .list-item{
    display:flex;
    gap:6px;
    margin-bottom:6px;
    align-items:flex-start;
  }
  .list-item textarea, .list-item input{flex:1;}
  .list-item button{flex-shrink:0;}
  .icon-btn{
    background:#fdeceb;
    color:#b3261e;
    border:1px solid #f2c6c2;
    border-radius:5px;
    width:28px;height:28px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
  }
  .add-btn{
    background:var(--panel);
    border:1px dashed #b7bcc2;
    color:#333;
    border-radius:6px;
    padding:6px 10px;
    font-size:12.5px;
    cursor:pointer;
    margin-top:2px;
  }
  .add-btn:hover{background:#eef1f4;}
  .two-col-item{
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px;
    margin-bottom:8px;
    background:var(--panel);
  }
  .two-col-item .top{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;
  }
  .two-col-item .top span{font-size:12px;font-weight:700;color:#555;}
  .file-row{display:flex;align-items:center;gap:8px;}
  .thumb{
    width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--line);
  }
  input[type=file]{font-size:12px;}
  .hint{font-size:11px;color:#888;margin-top:2px;}
  .toolbar{
    position:sticky;
    bottom:0;
    background:#fff;
    border-top:1px solid var(--line);
    padding:12px 0 0 0;
    margin-top:6px;
    display:flex;
    gap:8px;
  }
  .btn{
    flex:1;
    padding:10px 12px;
    border-radius:6px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    border:none;
  }
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:#164a70;}
  .btn-secondary{background:#eee;color:#333;border:1px solid #ccc;}
  .btn-secondary:hover{background:#e2e2e2;}

  /* ---------- PREVIEW (right) ---------- */
  .preview-pane{
    flex:1;
    padding:36px;
    display:flex;
    justify-content:center;
    overflow-y:auto;
    max-height:100vh;
  }
  .page{
    width:210mm;
    min-height:297mm;
    background:#fff;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
    padding:20mm 18mm;
    font-size:11pt;
    line-height:1.42;
    color:#000;
  }
  .doc-header{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    min-height:70px;
    margin-bottom:18px;
  }
  .doc-header img{max-height:60px;max-width:260px;object-fit:contain;}
  .doc-header .logo-placeholder{
    font-family:Georgia,'Times New Roman',serif;
    color:var(--blue);
    font-size:20px;
    font-style:italic;
    letter-spacing:.02em;
    text-align:right;
  }
  .doc-title{
    font-size:15.5pt;
    font-weight:700;
    color:var(--blue);
    margin:0 0 6px 0;
  }
  .title-rule{
    height:3px;
    width:64px;
    background:linear-gradient(90deg, var(--blue), var(--green));
    border:none;
    margin:0 0 14px 0;
    border-radius:2px;
  }
  .meta p{margin:1px 0;font-size:11pt;}
  .meta b{font-weight:700;}
  .sec-title{
    font-weight:700;
    font-size:11.5pt;
    color:var(--blue);
    margin:16px 0 6px 0;
  }
  .doc p{margin:6px 0;}
  .doc ul{margin:6px 0;padding-left:22px;}
  .doc ul li{margin-bottom:4px;}
  .photos-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin:10px 0;
  }
  .photo-box img{
    width:100%;
    height:200px;
    object-fit:cover;
    border:1px solid #ccc;
  }
  .photo-box .cap{
    text-align:center;
    font-style:italic;
    font-size:10pt;
    margin-top:4px;
  }
  .situatie-box{margin:14px 0;}
  .situatie-box img{
    width:100%;
    max-height:260px;
    object-fit:contain;
    border:1px solid #ccc;
    display:block;
  }
  .situatie-box .cap{
    text-align:center;
    font-style:italic;
    font-size:10pt;
    margin-top:4px;
  }
  .divider{
    border:none;
    border-top:1px solid #aaa;
    margin:22px 0 14px 0;
  }
  .sign-block p{margin:5px 0;}
  .sign-line{
    width:170px;
    border-bottom:1px solid #888;
    margin:0 0 8px 0;
  }
  .sign-img{
    max-width:170px;
    height:auto;
    display:block;
    margin:-8px 0 2px -6px;
    mix-blend-mode:multiply;
  }
  .empty-note{color:#999;font-style:italic;}

  @media print{
    html,body{background:#fff;}
    .form-pane{display:none !important;}
    .app{display:block;min-height:0;}
    .preview-pane{
      display:block !important;
      padding:0;
      overflow:visible;
      max-height:none;
    }
    .page{
      box-shadow:none;
      margin:0;
      width:auto;
      min-height:0;
      padding:14mm 16mm;
    }
    .photo-box, .situatie-box, .sign-block, .doc ul li{break-inside:avoid;}
    @page{ size:A4; margin:0; }
  }
  .pdf-mode{box-shadow:none !important;min-height:0 !important;}
  .print-only{display:none;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="app">

  <!-- ===================== FORM ===================== -->
  <div class="form-pane no-print">
    <h1>Rapport van bevindingen</h1>
    <p class="sub">Vul de gegevens in — rechts zie je direct het rapport. Klik onderaan op "Download PDF" als het klaar is.</p>

    <fieldset>
      <legend>Soort rapport</legend>
      <select id="rapportType">
        <option value="controle">Controlebezoek (verzoek tot handhaving)</option>
        <option value="monster">Monsterafname</option>
        <option value="anders">Anders</option>
      </select>
      <div class="hint" id="typeHint" style="display:none;">De aanleiding was al aangepast en is niet overschreven.</div>
    </fieldset>

    <fieldset>
      <legend>Gegevens bezoek</legend>
      <label class="first">Naam toezichthouder</label>
      <input type="text" id="naam" value="Remko Meijer">
      <label>Functie</label>
      <input type="text" id="functie" value="Toezichthouder/Handhaver Waterschap Noorderzijlvest">
      <div class="row2">
        <div>
          <label>Datum bezoek</label>
          <input type="text" id="datumBezoek" placeholder="bijv. 3 augustus 2026" value="3 augustus 2026">
        </div>
        <div>
          <label>Tijd bezoek</label>
          <input type="text" id="tijdBezoek" placeholder="bijv. 14.00 - 15.00 uur" value="14.00 uur – 15.00 uur">
        </div>
      </div>
      <label>Locatie</label>
      <input type="text" id="locatie" placeholder="Straat en plaats">
    </fieldset>

    <fieldset>
      <legend>Aanleiding</legend>
      <label class="first">Toelichting</label>
      <textarea id="aanleiding" rows="4">Naar aanleiding van een ontvangen verzoek tot handhaving is op [datum] een controlebezoek afgelegd. Het verzoek tot handhaving heeft betrekking op [omschrijving].</textarea>
      <label>Aanwezigen tijdens het controlebezoek</label>
      <div id="aanwezigenList"></div>
      <button type="button" class="add-btn" id="addAanwezige">+ Aanwezige toevoegen</button>
    </fieldset>

    <fieldset>
      <legend>Bevindingen</legend>
      <label class="first">Tijdens de controle is geconstateerd dat:</label>
      <div id="bevindingenList"></div>
      <button type="button" class="add-btn" id="addBevinding">+ Bevinding toevoegen</button>
    </fieldset>

    <fieldset>
      <legend>Foto's</legend>
      <div id="fotosList"></div>
      <button type="button" class="add-btn" id="addFoto">+ Foto toevoegen</button>
    </fieldset>

    <fieldset>
      <legend>Situatietekening</legend>
      <div class="file-row">
        <input type="file" id="situatieInput" accept="image/*">
      </div>
      <label>Bijschrift</label>
      <input type="text" id="situatieCaption" value="Situatietekening: ligging van de betreffende locatie">
    </fieldset>

    <fieldset>
      <legend>Gesprek</legend>
      <label class="first" style="font-weight:400;display:flex;gap:6px;align-items:center;margin-bottom:6px;">
        <input type="checkbox" id="geenGesprek"> Geen gesprek gevoerd (onderdeel weglaten uit rapport)
      </label>
      <textarea id="gesprek" rows="4">Tijdens het controlebezoek is gesproken met [betrokkene(n)]. ...</textarea>
    </fieldset>

    <fieldset>
      <legend>Acties</legend>
      <div id="actiesList"></div>
      <button type="button" class="add-btn" id="addActie">+ Actie toevoegen</button>
    </fieldset>

    <fieldset>
      <legend>Ondertekening</legend>
      <label class="first">Opgemaakt door</label>
      <input type="text" id="opgemaaktDoor" value="Remko Meijer">
      <div class="row2">
        <div>
          <label>Plaats</label>
          <input type="text" id="plaats" value="Groningen">
        </div>
        <div>
          <label>Datum</label>
          <input type="text" id="datumOndertekening" value="3 augustus 2026">
        </div>
      </div>
      <label>Functie (onder handtekening)</label>
      <input type="text" id="functieOnder" value="Toezichthouder/Handhaver Waterschap Noorderzijlvest">
    </fieldset>

    <div class="toolbar">
      <button class="btn btn-secondary" id="resetBtn">Nieuw rapport</button>
      <button class="btn btn-secondary" id="printBtn">Afdrukken</button>
      <button class="btn btn-primary" id="pdfBtn">Download PDF</button>
    </div>
  </div>

  <!-- ===================== PREVIEW ===================== -->
  <div class="preview-pane">
    <div class="page" id="page">
      <!-- filled by JS -->
    </div>
  </div>
</div>

function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function nl2br(s){
  return esc(s).split('\n').map(l=>l).join('<br>');
}

// ---------- dynamic list rendering (form side) ----------
function renderAanwezigen(){
  const wrap = document.getElementById('aanwezigenList');
  wrap.innerHTML='';
  state.aanwezigen.forEach((a,i)=>{
    const row = document.createElement('div');
    row.className='list-item';
    row.innerHTML = `
      <input type="text" placeholder="Naam" data-idx="${i}" data-field="naam" style="flex:1.2" value="${esc(a.naam)}">
      <input type="text" placeholder="Organisatie" data-idx="${i}" data-field="org" style="flex:1.2" value="${esc(a.org)}">
      <button type="button" class="icon-btn" data-remove="${i}">✕</button>
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const idx = +e.target.dataset.idx, field = e.target.dataset.field;
      state.aanwezigen[idx][field] = e.target.value;
      renderPreview();
    });
  });
  wrap.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.aanwezigen.splice(+e.target.dataset.remove,1);
      renderAanwezigen(); renderPreview();
    });
  });
}

function renderSimpleList(listName, containerId, placeholder){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML='';
  state[listName].forEach((val,i)=>{
    const row = document.createElement('div');
    row.className='list-item';
    row.innerHTML = `
      <textarea rows="2" placeholder="${placeholder}" data-idx="${i}">${esc(val)}</textarea>
      <button type="button" class="icon-btn" data-remove="${i}">✕</button>
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('textarea').forEach(t=>{
    t.addEventListener('input', e=>{
      state[listName][+e.target.dataset.idx] = e.target.value;
      renderPreview();
    });
  });
  wrap.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state[listName].splice(+e.target.dataset.remove,1);
      renderSimpleList(listName, containerId, placeholder); renderPreview();
    });
  });
}

function renderFotos(){
  const wrap = document.getElementById('fotosList');
  wrap.innerHTML='';
  state.fotos.forEach((f,i)=>{
    const box = document.createElement('div');
    box.className='two-col-item';
    box.innerHTML = `
      <div class="top">
        <span>Foto ${i+1}</span>
        <button type="button" class="icon-btn" data-remove="${i}">✕</button>
      </div>
      <div class="file-row">
        ${f.dataUrl ? `<img class="thumb" src="${f.dataUrl}">` : ''}
        <input type="file" accept="image/*" data-idx="${i}" class="fotoFile">
      </div>
      <label style="margin-top:6px;">Bijschrift</label>
      <input type="text" data-idx="${i}" class="fotoCaption" value="${esc(f.caption||'')}" placeholder="bijv. Foto 1: ...">
    `;
    wrap.appendChild(box);
  });
  wrap.querySelectorAll('.fotoFile').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const idx=+e.target.dataset.idx, file=e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        state.fotos[idx].dataUrl = ev.target.result;
        renderFotos(); renderPreview();
      };
      reader.readAsDataURL(file);
    });
  });
  wrap.querySelectorAll('.fotoCaption').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state.fotos[+e.target.dataset.idx].caption = e.target.value;
      renderPreview();
    });
  });
  wrap.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.fotos.splice(+e.target.dataset.remove,1);
      renderFotos(); renderPreview();
    });
  });
}

// ---------- preview rendering ----------
function renderPreview(){
  const page = document.getElementById('page');

  const headerHtml = `
    <div class="doc-header">
      ${state.logo ? `<img src="${state.logo}">` : `<div class="logo-placeholder">Uw organisatie</div>`}
    </div>
  `;

  const aanwezigenHtml = state.aanwezigen.filter(a=>a.naam||a.org).length
    ? `<p>Tijdens het controlebezoek waren aanwezig:</p><ul>${
        state.aanwezigen.filter(a=>a.naam||a.org).map(a=>`<li>${esc(a.naam)}${a.org?', '+esc(a.org):''}</li>`).join('')
      }</ul>`
    : '';

  const bevindingenHtml = state.bevindingen.filter(b=>b.trim()).length
    ? `<p>Tijdens de controle is geconstateerd dat:</p><ul>${
        state.bevindingen.filter(b=>b.trim()).map(b=>`<li>${nl2br(b)}</li>`).join('')
      }</ul>`
    : `<p class="empty-note">Nog geen bevindingen toegevoegd.</p>`;

  const fotosWithImg = state.fotos.filter(f=>f.dataUrl);
  const fotosHtml = fotosWithImg.length ? `
    <div class="sec-title">Foto's${state.situatie? ' en situatietekening':''}</div>
    <div class="photos-grid">
      ${fotosWithImg.map(f=>`
        <div class="photo-box">
          <img src="${f.dataUrl}">
          <div class="cap">${esc(f.caption||'')}</div>
        </div>
      `).join('')}
    </div>
  ` : (state.situatie ? `<div class="sec-title">Situatietekening</div>` : '');

  const situatieHtml = state.situatie ? `
    <div class="situatie-box">
      <img src="${state.situatie}">
      <div class="cap">${esc(state.situatieCaption||'')}</div>
    </div>
  ` : '';

  const actiesHtml = state.acties.filter(a=>a.trim()).length
    ? `<ul>${state.acties.filter(a=>a.trim()).map(a=>`<li>${nl2br(a)}</li>`).join('')}</ul>`
    : `<p class="empty-note">Nog geen acties toegevoegd.</p>`;

  page.innerHTML = `
    ${headerHtml}
    <div class="doc">
      <div class="doc-title">Rapport van bevindingen</div>
      <hr class="title-rule">
      <div class="meta">
        <p><b>Naam</b> : ${esc(state.naam)}</p>
        <p><b>Functie</b>: ${esc(state.functie)}</p>
        <p><b>Datum bezoek</b> : ${esc(state.datumBezoek)}</p>
        <p><b>Tijd bezoek</b> : ${esc(state.tijdBezoek)}</p>
        <p><b>Locatie</b> : ${esc(state.locatie)}</p>
      </div>

      <div class="sec-title">Aanleiding</div>
      <p>${nl2br(state.aanleiding)}</p>
      ${aanwezigenHtml}

      <div class="sec-title">Bevindingen</div>
      ${bevindingenHtml}

      ${fotosHtml}
      ${situatieHtml}

      ${state.geenGesprek ? '' : `
      <div class="sec-title">Gesprek</div>
      <p>${state.gesprek.trim() ? nl2br(state.gesprek) : '<span class="empty-note">Nog niets ingevuld.</span>'}</p>
      `}

      <div class="sec-title">Acties</div>
      ${actiesHtml}

      <hr class="divider">

      <div class="sign-block">
        <p><b>Opgemaakt door:</b></p>
        <p>${esc(state.opgemaaktDoor)}</p>
        <p>${esc(state.plaats)}${state.plaats&&state.datumOndertekening?', ':''}${esc(state.datumOndertekening)}</p>
        <p>Handtekening</p>
        ${state.signature ? `<img class="sign-img" src="${state.signature}"><div class="sign-line"></div>` : '<div class="sign-line" style="margin-top:26px;"></div>'}
        <p>${esc(state.functieOnder)}</p>
      </div>
    </div>
  `;
}

// ---------- wire up simple text fields ----------
function bindText(id, field){
  const el = document.getElementById(id);
  el.addEventListener('input', ()=>{ state[field] = el.value; renderPreview(); });
}
[
  ['naam','naam'],['functie','functie'],['datumBezoek','datumBezoek'],['tijdBezoek','tijdBezoek'],
  ['locatie','locatie'],['aanleiding','aanleiding'],['situatieCaption','situatieCaption'],
  ['gesprek','gesprek'],['opgemaaktDoor','opgemaaktDoor'],['plaats','plaats'],
  ['datumOndertekening','datumOndertekening'],['functieOnder','functieOnder']
].forEach(([id,field])=>bindText(id,field));

document.getElementById('situatieInput').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ev=>{ state.situatie = ev.target.result; renderPreview(); };
  r.readAsDataURL(file);
});

document.getElementById('addAanwezige').addEventListener('click', ()=>{
  state.aanwezigen.push({naam:'',org:''}); renderAanwezigen(); renderPreview();
});
document.getElementById('addBevinding').addEventListener('click', ()=>{
  state.bevindingen.push(''); renderSimpleList('bevindingen','bevindingenList','Beschrijf de bevinding'); renderPreview();
});
document.getElementById('addActie').addEventListener('click', ()=>{
  state.acties.push(''); renderSimpleList('acties','actiesList','Beschrijf de actie'); renderPreview();
});
document.getElementById('addFoto').addEventListener('click', ()=>{
  state.fotos.push({dataUrl:null,caption:''}); renderFotos(); renderPreview();
});

document.getElementById('printBtn').addEventListener('click', ()=>window.print());

document.getElementById('pdfBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('pdfBtn');
  if(typeof html2pdf === 'undefined'){
    alert('De PDF-generator kon niet geladen worden (geen internet?). Het afdrukvenster wordt geopend: kies daar "Opslaan als PDF".');
    window.print(); return;
  }
  const page = document.getElementById('page');
  const safe = s => (s||'').trim().replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'');
  const naamDeel = safe(state.locatie) || safe(state.datumBezoek) || 'concept';
  const opt = {
    margin: 0,
    filename: 'Rapport_van_bevindingen_' + naamDeel + '.pdf',
    image: { type:'jpeg', quality:0.96 },
    html2canvas: { scale:2, useCORS:true, backgroundColor:'#ffffff', scrollY:0 },
    jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
    pagebreak: { mode:['css','legacy'], avoid:['.photo-box','.situatie-box','.sign-block','li'] }
  };
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'PDF maken...';
  page.classList.add('pdf-mode');
  try{
    await html2pdf().set(opt).from(page).save();
  }catch(err){
    console.error(err);
    alert('PDF maken is mislukt. Gebruik "Afdrukken" en kies "Opslaan als PDF".');
  }finally{
    page.classList.remove('pdf-mode');
    btn.disabled = false; btn.textContent = label;
  }
});

// ---------- nieuw rapport ----------
const AANLEIDING_PER_TYPE = {
  controle: 'Naar aanleiding van een ontvangen verzoek tot handhaving is op [datum] een controlebezoek afgelegd. Het verzoek tot handhaving heeft betrekking op [omschrijving].',
  monster:  'Op [datum] is een monster genomen van [omschrijving]. Aanleiding hiervoor is [toelichting komt].',
  anders:   '[toelichting komt]'
};
function aanleidingTemplate(){ return AANLEIDING_PER_TYPE[state.rapportType] || AANLEIDING_PER_TYPE.controle; }
const GESPREK_TEMPLATE = 'Tijdens het controlebezoek is gesproken met [betrokkene(n)]. ...';
const SITUATIE_CAPTION_DEFAULT = 'Situatietekening: ligging van de betreffende locatie';

function vandaagNL(){
  return new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'});
}

function nieuwRapport(){
  const vandaag = vandaagNL();
  // naam, functie, opgemaakt door, plaats, functie onder handtekening, logo en handtekening blijven staan
  Object.assign(state,{
    datumBezoek: vandaag, tijdBezoek:'', locatie:'',
    aanleiding: aanleidingTemplate(),
    aanwezigen:[{naam:'',org:''}],
    bevindingen:[''],
    fotos:[], situatie:null, situatieCaption: SITUATIE_CAPTION_DEFAULT,
    gesprek: GESPREK_TEMPLATE,
    acties:[''],
    datumOndertekening: vandaag
  });

  document.querySelectorAll('.form-pane input[type=text], .form-pane textarea').forEach(el=>{
    if(el.id && Object.prototype.hasOwnProperty.call(state, el.id)) el.value = state[el.id];
  });
  document.getElementById('situatieInput').value='';
  zetGeenGesprek(state.rapportType === 'monster');

  renderAanwezigen();
  renderSimpleList('bevindingen','bevindingenList','Beschrijf de bevinding');
  renderSimpleList('acties','actiesList','Beschrijf de actie');
  renderFotos();
  renderPreview();
  document.querySelector('.form-pane').scrollTop = 0;
}

// twee keer klikken om te bevestigen (confirm() wordt in sommige omgevingen geblokkeerd)
(function(){
  const btn = document.getElementById('resetBtn');
  const label = btn.textContent;
  let armed = false, timer = null;
  function disarm(){
    armed = false; clearTimeout(timer);
    btn.textContent = label; btn.style.background=''; btn.style.color='';
  }
  btn.addEventListener('click', ()=>{
    if(!armed){
      armed = true;
      btn.textContent = 'Alles wissen? Klik nogmaals';
      btn.style.background = '#fdeceb'; btn.style.color = '#b3261e';
      timer = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    nieuwRapport();
  });
})();

// gesprek aan/uit
function zetGeenGesprek(aan){
  state.geenGesprek = !!aan;
  document.getElementById('geenGesprek').checked = state.geenGesprek;
  document.getElementById('gesprek').disabled = state.geenGesprek;
}
document.getElementById('geenGesprek').addEventListener('change', e=>{
  zetGeenGesprek(e.target.checked); renderPreview();
});

// soort rapport -> aanleiding-tekst aanpassen (alleen als die nog onaangeroerd is)
document.getElementById('rapportType').addEventListener('change', e=>{
  const oud = aanleidingTemplate();
  const huidig = state.aanleiding;
  state.rapportType = e.target.value;
  zetGeenGesprek(state.rapportType === 'monster');
  const hint = document.getElementById('typeHint');
  if(!huidig.trim() || huidig === oud){
    state.aanleiding = aanleidingTemplate();
    document.getElementById('aanleiding').value = state.aanleiding;
    hint.style.display = 'none';
  } else {
    hint.style.display = 'block';
  }
  renderPreview();
});

// gesprek-veld: state gelijk trekken met wat in het veld staat
state.gesprek = document.getElementById('gesprek').value;

// init
renderAanwezigen();
renderSimpleList('bevindingen','bevindingenList','Beschrijf de bevinding');
renderSimpleList('acties','actiesList','Beschrijf de actie');
renderFotos();
renderPreview();
</script>
